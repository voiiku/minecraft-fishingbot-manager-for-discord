[package]
name = "minecraft-fishingbot-manager-for-discord"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/voiiku/minecraft-fishingbot-manager-for-discord"

[lib]
name = "minecraft_fishingbot_manager_for_discord"
path = "src/lib.rs"

[[bin]]
name = "minecraft-fishingbot-manager-for-discord"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
craftping = { version = "0.8.0", features = ["async-tokio"] }
log = "0.4.35"
poise = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = "0.12.5"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
input-pulse = "0.1.2"


[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
