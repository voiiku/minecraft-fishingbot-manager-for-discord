name: Release
run-name: Release ${{ github.ref_name }}

# 推 v* 标签时编译并发布。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 当前只支持 64 位 Linux。
    name: Build and release (Linux x86_64 musl)
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      # 检验标签版本与 Cargo.toml 中一致。
      - name: Validate release tag version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"

          if [[ -z "$version" || "$version" != "$package_version" ]]; then
            echo "Tag version '$version' does not match Cargo.toml version '$package_version'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      # 版本要与 ci.yml 里的一致，否则两边生成的第三方许可证清单会有差异。
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # 生成一份清单。
      - name: Regenerate third-party notices
        run: |
          cargo fetch --locked
          cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      # 复制到工作区根目录，并改名为带版本、系统、架构与 ABI 的可执行文件。
      - name: Rename release binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          binary_name="minecraft-fishingbot-manager-for-discord"
          release_binary="${binary_name}-${VERSION}-linux-x86_64-musl"
          install -m 0755 \
            "target/x86_64-unknown-linux-musl/release/$binary_name" \
            "$release_binary"

      # 标签对应的 GitHub Release包含：二进制文件 + LICENSE + 第三方许可清单。
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            minecraft-fishingbot-manager-for-discord-${{ steps.version.outputs.version }}-linux-x86_64-musl
            LICENSE
            THIRD-PARTY-NOTICES.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
