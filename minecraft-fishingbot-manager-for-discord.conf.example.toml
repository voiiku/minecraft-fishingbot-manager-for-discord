# ============================================================================
# configuration
# Written here on first start when the file is missing.
# Do not rename the file.
# Every field is required, and the file is read once at startup.
# Restart the process to apply changes.
# Time values are in seconds. Former millisecond fields accept multiples of 0.001 seconds.
# Old time keys with unit suffixes are no longer accepted.
# ============================================================================
# ------------------------------ Language ------------------------------
# Language of the Discord replies, this process's log and its error messages.
# The same value is written into the generated `conf.json` as `misc.language`, so the jar speaks it too.
# Values: `ENGLISH` or `CHINESE_SIMPLIFIED` (the names FishingBot itself uses).
[i18n]
language = "ENGLISH"

# ------------------------------ Discord connection ------------------------------
[discord]
# https://discord.com/developers/applications -> your app -> Bot -> Reset Token (shown once).
# One token can only run one instance at a time; a second one conflicts with it.
token = "Paste Your Discord Bot Token Here"

# ------------------------------ File paths ------------------------------
[paths]
# Root directory: the common parent of the bot directories and of the files below.
# Must be an absolute path.
base_dir = "/absolute/path/yourfolder/fishingbots"
# File name of your `FishingBot.jar`, relative to base_dir. Update it when you upgrade the jar.
jar = "FishingBot-2.13.15.jar"
# File name of the config FishingBot itself reads (its `conf.json`), relative to base_dir.
# This project writes that file at startup from `[fishingbot]` below and deletes the old file first, so edits to it do not survive a restart.
# Change `[fishingbot]` instead.
fishingbot_config_file_name = "conf.json"

# ------------------------------ FishingBot's config ------------------------------
# Shared by every Fishingbot.
# The keys not exposed here are documented in `docs/mods/config/*`.
[fishingbot]
# Game server address (domain or IP) and port.
server_ip = "127.0.0.1"
server_port = 25565
# Protocol version: `AUTOMATIC` lets FishingBot detect it.
# When detection fails, put the exact version here, e.g. "1.20.4".
default_protocol = "AUTOMATIC"
# Reconnect after a disconnect, and how many seconds to wait.
auto_reconnect = true
auto_reconnect_time = 30
# Commands to run right after joining the server. An empty list means "do nothing".
start_text = ["/home fishing"]
# What to announce on the console / in the game chat when something is caught.
# Values (upstream `AnnounceType`): ALL, ALL_BUT_FISH, ONLY_ENCHANTED, ONLY_BOOKS, NONE.
# `[keywords] filter_regex` drops those lines and the bot state is read from the log, so most bots do not need to announce anything.
announce_type_console = "NONE"
announce_type_chat = "NONE"

# ------------------------------ Admins ------------------------------
# Format: Discord user ID = "display name" (the name is only shown by `/show admins`).
# Admins can operate any bot and use `/startall`, `/stopall`, `/restartall`, `/commandall` and `/anti-afk`.
[admins]
"123456789012345678" = "your name"

# ------------------------------ Log keywords ------------------------------
# These strings turn the bot log into the state shown by `/status`.
# Re-check them after switching game servers, after the server changes its messages and after a jar upgrade, otherwise the state is judged wrongly.
[keywords]
# The line your game server prints when the bot joins successfully.
online = "Welcome to the xxx server"
# Regex for noisy game lines, handed to `grep -v -E`: matching lines are dropped and never written.
filter_regex = "([+][0-9.]+XP|is now AFK.|is no longer AFK.|is now away from keyboard.)"

# ------------------------------ Command echo confirmation ------------------------------
# After `/pause` or `/unpause` is sent, wait `wait` seconds and scan the newest log's last `scan_lines` lines for the two echoes below: they decide whether the command really took effect.
[command_echo]
# The line the JAR prints when it receives `/pause` or `/unpause`.
# The defaults match the English build.
# Will be deprecated (once a pause command is added to the original Fishingbot)
pause_echo = "Fishing paused"
# Will be deprecated (once a pause command is added to the original Fishingbot)
unpause_echo = "Fishing resumed"
# How long to wait before reading the log for that echo, in seconds.
# Affects: the reply delay of `/pause` and `/unpause`.
wait = 0.3
# How many trailing log lines to scan for the echo.
# Affects: the reply delay of `/pause` and `/unpause`.
scan_lines = 50

# ------------------------------ Runtime ------------------------------
[runtime]
# JVM flags for every bot. With many instances the memory quota has to stay low.
# Affects: the JVM arguments of the start command (`utils/startup.rs`).
# There is no need to go lower; with plenty of RAM you can raise -Xmx (for example -Xmx256m).
java_opts = "-Xms32m -Xmx128m -XX:+UseSerialGC"
# Screen session prefix; the session name looks like `fb_<bot name>`.
# You do not need to change it unless it collides with sessions of another program.
# Affects: the session name (`utils/screen.rs`, session_name), which is used both to send a command to a bot and to check whether it runs.
screen_prefix = "fb1_"
# File name holding the `refreshToken` inside the bot directory (`/token` writes exactly this file).
# You normally do not need to change it.
token_file = "refreshToken"
# The bot logs directory (by default `<base_dir>/bots/<user id>/<bot name>/logs`).
# Every start writes a new file (`logs/<timestamp>.log`), older log files are kept, and only the filtered lines are written.
# You normally do not need to change it.
bot_logs_dir = "logs"
# The line limit for the `/log` reply; the log is sent as an attachment.
# Affects: the line limit of `/log`.
max_reply_log_lines = 100
# Maximum characters per reply: longer replies are cut at a line boundary and the number of omitted lines is appended.
# Discord hard-limits one message to 2000 characters (UTF-16); a longer one fails to send.
# You normally do not need to change it.
max_reply_chars = 2000
# Maximum number of autocomplete suggestions for the options.
# Discord hard-limits an autocomplete response to 25 choices, so the accepted range is 1 - 25.
max_autocomplete_choices = 25

# ------------------------------ Anti-AFK input ------------------------------
# All keys in this table are required. The target is every GNU screen session whose
# name contains runtime.screen_prefix; this feature is not started automatically.
[anti_afk]
# Input-pulse action syntax: !/! is slash, !! is a literal !, and !ENTER! submits.
# Check https://crates.io/crates/input-pulse for more details on the syntax and usage.
command = "!/!!/!!ENTER!"
# Seconds between completed input cycles; must be greater than 0.
execution_interval = 180
# Seconds after each character or key; must be finite and non-negative (0 is allowed).
input_delay = 0.05

# ------------------------------ FishingBot Startup queue ------------------------------
# One global FIFO queue is shared by `/start`, `/startall`, `/restart` and `/restartall`.
# `/bot login` does not use this queue.
[startup_queue]
# Maximum number of bots to launch in one batch.
max_batch_size = 1
# Minimum gap between two sign-ins inside the same batch, in seconds.
# Microsoft rate-limits sign-ins per egress IP: about one every 20 seconds is stable, one every 12 seconds loses the last bot, and several sign-ins within a few seconds trip a penalty window that rejects every sign-in for the next few tens of seconds (see docs/troubleshooting section 12).
# Affects: the stagger inside one batch of the start queue (`utils/startup`).
bot_login_interval = 1
# Wait between two batches, in seconds.
# Counted from the moment the previous batch was popped; verification runs in parallel and does not delay the next batch, and this wait applies even when the batch held one bot.
# Affects: the gap between batches of the start queue (`utils/startup`).
batch_login_interval = 20
# Maximum number of queued requests waiting for the dispatcher. Does not include the active request.
# Its value also sets how long a start waits for its results: the queue derives that timeout from this table (a full queue at the pacing above, times two), so a bigger queue means a longer wait before results are called unconfirmed.
max_pending_requests = 32

# ------------------------------ Timing ------------------------------
# All values are seconds; decimal values use 0.001-second precision.
[timing]
# Session-survival grace period per start request, in seconds: a bot is considered started when its session is still there after this long (a failed launch dies within seconds).
# Whether it joined the game is reported from the log, but does not decide the outcome.
check_grace = 5
# Grace period for a JVM to exit before it is force-killed.
stop_grace = 3
# Wait after force-killing sessions before checking that they have exited.
stop_settle = 0.5
# Continuous probe-failure window before reconnecting; also the delay before reconnect.
# The REST probe interval (a third of this window) and the first-handshake timeout (twice this window) are derived from this value; they are not separate keys.
watchdog_window = 30

# ------------------------------ FishingBot's own raw logs ------------------------------
# The raw log of `FishingBot.jar` itself.
# These three keys follow the JAR: change them here when it changes its directory name or file name pattern.
# You normally do not need to change them.
[raw_game_logs]
# Directory name of the raw logs (by default: `/<runtime.bot_logs_dir>/raw/`).
# Affects: the directory wiped and recreated before every start (`utils/startup.rs`, reset_fishingbot_logs_dir).
dir_name = "raw"
# First raw log file name. FishingBot.jar currently uses the rolling pattern `log%g.log`.
# Pointing it at `discard_path` creates the file successfully without keeping its content.
file_name = "log0.log"
# Where the raw log goes. By default it is thrown away and only the filtered log is kept.
# You can change it to another path.
discard_path = "/dev/null"

# ------------------------------ /ping default target ------------------------------
[ping]
# Target of `/ping` when it is called without arguments.
# Explicit hosts must resolve only to public addresses; the configured default is trusted.
# Proxy Fake-IP DNS (for example 198.18.0.0/15) can cause a public domain to be rejected.
# Configure the proxy/DNS to return real public addresses for that domain; see
# Read docs/troubleshooting/troubleshooting-en_us.md for more detail.
default_ping_host = "your.gameserver.address"
default_ping_port = 25565
timeout = 3

# ------------------------------ Process log level ------------------------------
# `false`: this project's logs, plus the framework's (serenity / poise) WARN/ERROR.
# `true`: everything.
# The log goes to the terminal and to `logs/<timestamp>.log`.
[log]
debug = false

# ------------------------------ Help menu ------------------------------
[text]
# Full output of `/help`; edit the wording freely, no rebuild needed.
help = """Bot names are case-insensitive nicknames; use letters, numbers, underscores or hyphens.
Before fishing, save a spot with /sethome fishing and equip a Mending fishing rod.
This project stores Minecraft login credentials; only log in if you trust the operator.

/help Show this menu
/whoami Show your Discord user ID for the admins table
/ping [host] [port] Probe a game server; omitted options use configured defaults
/checkserver Show fishing host performance

/bot add <name> Add a bot (a token is still required)
/bot del <name> Delete a bot's directory
/bot rename <old name> <new name> Rename a bot
/bot login <name> Sign in with Microsoft; the private reply gives a link and code
/token <name> Enter a token privately if /bot login fails
/log <name> [lines] Get a private log attachment (up to the configured limit)

/start <name> Start a bot
/stop <name> Stop a bot
/restart <name> Restart a bot
/command <name> <command> Send a game command; without a leading slash it is chat
/pause <name> Pause fishing without disconnecting
/unpause <name> Resume fishing

/show status Show running bots and anti-AFK status
/show botconfig Show the shared fishing bot configuration
/show mybots Show your bots and their token presence
/show allbots Show all bots and their token presence
/show admins Show the administrator list

/startall (admins only) Start bots with tokens; sign-in limits may cause failures
/stopall (admins only) Stop all bots
/restartall (admins only) Restart running bots; some may fail
/commandall <command> (admins only) Send a command to running bots
/anti-afk <on|off> (admins only) Start or stop anti-AFK for matching screen sessions"""
