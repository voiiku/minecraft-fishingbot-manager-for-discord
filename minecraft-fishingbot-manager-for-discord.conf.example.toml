# Generated on first start; do not rename. Restart after editing.
# All fields except discord.guild_ids are required.
# Times are in seconds; formerly millisecond fields require 0.001-second precision.
# Time keys with unit suffixes are not supported.
# ------------------------------ Language ------------------------------
# Discord replies, program logs and FishingBot `misc.language`:
# `ENGLISH` or `CHINESE_SIMPLIFIED`.
[i18n]
language = "ENGLISH"

# ------------------------------ Discord connection ------------------------------
[discord]
# Bot token: https://discord.com/developers/applications -> Bot -> Reset Token.
# Run only one instance per token.
token = "Paste Your Discord Bot Token Here"
# Empty: global commands. Otherwise: server IDs as strings; the bot must belong to each server.
# Example: guild_ids = ["123456789012345678", "234567890123456789"]
# After changing this list, restart and run /sync-commands.
guild_ids = []

# ------------------------------ File paths ------------------------------
[paths]
# Absolute root directory for bot directories and the following files.
base_dir = "/absolute/path/yourfolder/fishingbots"
# FishingBot JAR file name, relative to base_dir.
jar = "FishingBot-2.13.15.jar"
# Game configuration file name, relative to base_dir.
# Regenerated at startup from `[fishingbot]`; direct edits do not persist.
fishingbot_config_file_name = "config.json"

# ------------------------------ FishingBot's config ------------------------------
# Shared by all bots; additional JAR settings are documented in `docs/mods/config/*`.
[fishingbot]
# Game server address and port.
server_ip = "127.0.0.1"
server_port = 25565
# `AUTOMATIC` detects the protocol; use an explicit version if detection fails.
default_protocol = "AUTOMATIC"
# Automatic reconnect and delay in seconds.
auto_reconnect = true
auto_reconnect_time = 30
# Commands executed after joining; an empty list disables them.
start_text = ["/home fishing"]
# Catch announcements for console and chat:
# ALL, ALL_BUT_FISH, ONLY_ENCHANTED, ONLY_BOOKS, NONE.
announce_type_console = "NONE"
announce_type_chat = "NONE"

# ------------------------------ Admins ------------------------------
# Discord user ID = display name; administrators can manage all bots and batch commands.
[admins]
"123456789012345678" = "your name"

# ------------------------------ Log keywords ------------------------------
# Keywords determine the state displayed by `/show status`; update them after server or JAR changes.
[keywords]
# Case-sensitive literal substring of the join message, excluding the player name.
# It must remain in the filtered log.
online = "Welcome to the xxx server"
# `grep -v -E` expression; matching lines are excluded from the log.
filter_regex = "([+][0-9.]+XP|is now AFK.|is no longer AFK.|is now away from keyboard.)"

# ------------------------------ Command echo confirmation ------------------------------
# Pause/unpause and pauseall/unpauseall confirmation scans new log output after the configured wait.
[command_echo]
# JAR command echoes; defaults match the English build.
# These fields may be deprecated when upstream supports pause commands.
pause_echo = "Fishing paused"
unpause_echo = "Fishing resumed"
# Delay before reading the log, in seconds.
wait = 0.3
# Maximum trailing lines to scan.
scan_lines = 50

# ------------------------------ Runtime ------------------------------
[runtime]
# JVM options shared by all bots; adjust heap limits for available memory.
java_opts = "-Xms32m -Xmx128m -XX:+UseSerialGC"
# Screen session prefix; avoid collisions with other programs.
screen_prefix = "fb1_"
# Token file name within each bot directory.
token_file = "refreshToken"
# Bot log directory; each start creates a timestamped filtered log and retains older files.
bot_logs_dir = "logs"
# Maximum log lines in the `/log` attachment.
max_reply_log_lines = 100
# Reply limit in UTF-16 code units; Discord permits at most 2000.
# Longer replies are truncated at line boundaries.
max_reply_chars = 2000
# Autocomplete suggestion limit: 1-25.
max_autocomplete_choices = 25

# ------------------------------ Anti-AFK input ------------------------------
# Targets every screen session whose name contains runtime.screen_prefix.
# Not started automatically.
[anti_afk]
# Input-pulse syntax: !/! = slash, !! = literal !, !ENTER! = submit.
# See https://crates.io/crates/input-pulse.
command = "!/!!/!!ENTER!"
# Seconds between completed input cycles; must be greater than 0.
execution_interval = 180
# Seconds after each character or key; must be finite and non-negative (0 is allowed).
input_delay = 0.05

# ------------------------------ FishingBot Startup queue ------------------------------
# Shared FIFO queue for `/start`, `/startall`, `/restart` and `/restartall`.
# `/bot login` bypasses the queue.
[startup_queue]
# Maximum number of bots to launch in one batch.
max_batch_size = 1
# Gap between sign-ins in a batch, in seconds.
# Microsoft rate-limits sign-ins per egress IP; see docs/troubleshooting section 12.
bot_login_interval = 1
# Gap between batches, in seconds, measured from the previous dequeue.
# Verification runs independently; this interval also applies to single-bot batches.
batch_login_interval = 20
# Maximum waiting requests, excluding the active batch.
# The result timeout is derived from this limit and the queue timing.
max_pending_requests = 32

# ------------------------------ Timing ------------------------------
# All values are seconds; decimal values use 0.001-second precision.
[timing]
# Session-survival grace period per start request, in seconds.
# Game-server join status is read separately from the log.
check_grace = 20
# Grace period for a JVM to exit before it is force-killed.
stop_grace = 3
# Session deregistration delay before the final stop check.
stop_settle = 0.5
# Continuous probe-failure window before reconnecting; also the delay before reconnect.
# REST probe interval: one third of the window; first-handshake timeout: twice the window.
watchdog_window = 30

# ------------------------------ FishingBot's own raw logs ------------------------------
# FishingBot JAR raw-log settings; update if its log naming changes.
[raw_game_logs]
# Raw-log directory under the bot log directory; recreated at every start.
dir_name = "raw"
# First raw log file; FishingBot uses the `log%g.log` rolling pattern.
file_name = "log0.log"
# Symlink target for the raw log; `/dev/null` discards its content.
discard_path = "/dev/null"

# ------------------------------ /ping default target ------------------------------
[ping]
# Default `/ping` target.
# Explicit hosts must resolve only to public addresses; the configured default is trusted.
# Proxy Fake-IP DNS may cause rejection; see docs/troubleshooting/troubleshooting-en_us.md.
default_ping_host = "your.gameserver.address"
default_ping_port = 25565
# Probe timeout in seconds.
timeout = 3

# ------------------------------ Process log level ------------------------------
# `false`: application INFO and dependency WARN; `true`: both at DEBUG.
# Logs are written to the terminal and `logs/<timestamp>.log`.
[log]
debug = false

# ------------------------------ Help menu ------------------------------
[text]
# `/help` output; editable without rebuilding.
help = """Bot names are case-insensitive nicknames; use letters, numbers, underscores or hyphens.
Before fishing, save a spot with /sethome fishing and equip a Mending fishing rod.
This project stores Minecraft login credentials; only log in if you trust the operator.

/help Show this menu
/whoami Show your Discord user ID for the admins table
/ping [host] [port] Probe a game server; omitted options use configured defaults
/checkserver Show fishing host performance

/bot add <name> Add a bot (a token is still required)
/bot del <name> Delete a bot's directory
/bot rename <old name> <new name> Rename a bot
/bot login <name> Sign in with Microsoft; the private reply gives a link and code
/token <name> Enter a token privately if /bot login fails
/log <name> [lines] Get a private log attachment (up to the configured limit)

/start <name> Start a bot
/stop <name> Stop a bot
/restart <name> Restart a bot
/command <name> <command> Send a game command; without a leading slash it is chat
/pause <name> Pause fishing without disconnecting
/unpause <name> Resume fishing

/show status Show running bots and anti-AFK status
/show botconfig Show the shared fishing bot configuration
/show mybots Show your bots and their token presence
/show allbots Show all bots and their token presence
/show admins Show the administrator list

/startall (admins only) Start bots with tokens; sign-in limits may cause failures
/stopall (admins only) Stop all bots
/restartall (admins only) Restart running bots; some may fail
/pauseall (admins only) Attempt to pause fishing for running bots
/unpauseall (admins only) Attempt to resume fishing for running bots
/commandall <command> (admins only) Send a command to running bots
/sync-commands (admins only) Update commands in the configured scope and remove old commands
/anti-afk <on|off> (admins only) Start or stop anti-AFK for all bots"""
